
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Peraturan Admin — Friends Family</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c2d;
      --panel2: #17243a;
      --line: #263750;
      --text: #edf3fb;
      --muted: #9aabc1;
      --gold: #d8b878;
      --gold2: #f0d9a5;
      --blue: #7da7d8;
      --danger: #e38e8e;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at 80% -10%, #263956 0, transparent 38%), var(--bg);
      color: var(--text);
      font: 15px/1.7 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input {
      font: inherit;
    }

    /* Menghilangkan efek warna kotak biru/tap highlight pada HP */
    button, input, a, .role-card {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    /* Sidebar */
    .sidebar {
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 26px 18px;
      border-right: 1px solid var(--line);
      background: rgba(13, 23, 39, 0.94);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 22px;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid #b99b62;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--gold2);
      font-family: Georgia, serif;
      font-size: 19px;
      letter-spacing: -2px;
    }

    .brand strong {
      display: block;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .brand small {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .nav-label {
      color: #71839c;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.7px;
      padding: 0 10px;
      margin: 2px 0 5px;
    }

    .nav {
      display: grid;
      gap: 5px;
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #b6c4d6;
      padding: 10px 12px;
      border-radius: 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 11px;
      transition: 0.2s;
    }

    .nav button:hover {
      background: #1b2a40;
      color: #ffffff;
    }

    .nav button.active {
      background: linear-gradient(100deg, #34465f, #1d3049);
      color: var(--gold2);
      box-shadow: inset 3px 0 var(--gold);
    }

    .nav .ico {
      width: 20px;
      text-align: center;
      color: var(--gold);
    }

    .side-foot {
      margin-top: auto;
      color: #72839b;
      font-size: 11px;
      padding: 12px 9px;
      border-top: 1px solid var(--line);
    }

    /* Main Area */
    .main {
      min-width: 0;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(18px, 4vw, 54px);
      background: rgba(13, 23, 39, 0.66);
      position: sticky;
      top: 0;
      z-index: 4;
      backdrop-filter: blur(14px);
    }

    .crumb {
      color: var(--muted);
      font-size: 13px;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .content {
      max-width: 1050px;
      margin: auto;
      padding: 42px clamp(18px, 4vw, 54px) 80px;
    }

    /* Hero Component */
    .hero {
      border: 1px solid #46536a;
      background: linear-gradient(120deg, #1c2b40, #111d30 68%, #2a2c35);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 48px);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .hero:after {
      content: "FF";
      position: absolute;
      right: 4%;
      top: -40px;
      font: 200px Georgia, serif;
      color: rgba(216, 184, 120, 0.05);
      letter-spacing: -25px;
      pointer-events: none;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 2.5px;
      font-size: 10px;
      font-weight: 800;
    }

    .hero h1 {
      font: clamp(30px, 5vw, 48px)/1.12 Georgia, serif;
      letter-spacing: 0.4px;
      margin: 12px 0;
    }

    .hero p {
      color: #b7c5d7;
      max-width: 650px;
      margin: 0;
    }

    .hero-meta {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .pill {
      font-size: 11px;
      color: #e4d4b4;
      border: 1px solid #786747;
      border-radius: 99px;
      padding: 5px 10px;
      background: rgba(216, 184, 120, 0.07);
    }

    /* Stats Grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0 30px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 16px;
    }

    .stat b {
      font: 27px Georgia, serif;
      color: var(--gold2);
      display: block;
    }

    .stat span {
      font-size: 11px;
      color: var(--muted);
    }

    /* Content Cards & Sections */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin: 34px 0 14px;
    }

    .section-head h2 {
      font: 27px Georgia, serif;
      margin: 0;
    }

    .section-head p {
      color: var(--muted);
      font-size: 12px;
      margin: 3px 0 0;
    }

    .search {
      width: min(270px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--gold);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .role-card {
      background: linear-gradient(145deg, #17253a, #111b2b);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .role-card:hover {
      transform: translateY(-2px);
      border-color: #9e875c;
    }

    .role-card .num {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 1.6px;
    }

    .role-card h3 {
      font: 21px Georgia, serif;
      margin: 7px 0;
    }

    .role-card p {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: clamp(18px, 3vw, 28px);
      margin-top: 16px;
    }

    .panel h2 {
      font: 27px Georgia, serif;
      margin: 0 0 5px;
    }

    .panel .intro {
      color: var(--muted);
      margin: 0 0 20px;
    }

    .article h3 {
      font-size: 16px;
      color: var(--gold2);
      margin: 25px 0 8px;
    }

    .article h3:first-child {
      margin-top: 0;
    }

    .article ol, .article ul {
      padding-left: 23px;
      color: #d5dfeb;
    }

    .article li {
      padding: 3px 0 3px 4px;
    }

    .article li::marker {
      color: var(--gold);
    }

    .article p {
      color: #d5dfeb;
    }

    .callout {
      border-left: 3px solid var(--gold);
      background: rgba(216, 184, 120, 0.07);
      padding: 13px 16px;
      border-radius: 0 10px 10px 0;
      color: #e7d9bd;
      margin: 18px 0;
    }

    .callout-danger {
      border-left: 3px solid var(--danger);
      background: rgba(227, 142, 142, 0.1);
      color: #fca5a5;
    }

    /* Matrix Table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: 16px 0;
    }

    .matrix {
      border-collapse: collapse;
      width: 100%;
      min-width: 650px;
      font-size: 12px;
    }

    .matrix th, .matrix td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .matrix th {
      background: #1a2940;
      color: var(--gold2);
    }

    .matrix td:first-child {
      text-align: left;
      color: #dce5ef;
    }

    .footer {
      margin-top: 42px;
      padding: 22px 10px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: #7788a0;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    /* Responsive Design */
    @media (max-width: 850px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 280px;
        transform: translateX(-105%);
        transition: 0.25s;
        box-shadow: var(--shadow);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-btn {
        display: inline-block;
      }
      .topbar {
        padding: 0 16px;
      }
      .content {
        padding-top: 24px;
      }
      .stats {
        gap: 8px;
      }
      .stat {
        padding: 12px;
      }
      .cards {
        grid-template-columns: 1fr;
      }
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }
      .search {
        width: 100%;
      }
    }
  </style>
</head>

    function listBlock(title, items) {

    }

      return `
        <div class="panel article">
          <h2>${name}</h2>
          <p class="intro">${desc}</p>
          ${listBlock('A. Tugas dan Tanggung Jawab', tasks)}
          ${listBlock('B. Hak dan Wewenang Chat', powers)}
          ${listBlock('C. Batasan & Larangan Admin', limits)}
        </div>
      `;
    }

      ['ketua', '♟', 'Ketua Cabang', 'Pengatur keaktifan obrolan dan pembagi tugas admin.'],
      ['admin', '◉', 'Admin Biasa', 'Moderator chat: pembersih spam, perusuh, dan penyapa member.'],
      ['coordination', '⇄', 'Koordinasi & Keputusan', 'Alur pengangkatan admin, penanganan keributan, & pencopotan.'],
      ['ethics', '◇', 'Etika & Kedisiplinan', 'Kewajiban menjaga obrolan ramah dan larangan admin.'],
      ['sanctions', '⚖', 'Sanksi & Keaktifan', 'Tahapan sanksi dan toleransi keaktifan admin.']
    ];

    function render(page, pushHistory = true) {
      const p = pages[page] || pages.home;
      document.getElementById('content').innerHTML = page === 'home' 
        ? p.html 
        : p.html + `<div class="footer">FRIENDS FAMILY COMMUNITY · PERATURAN ADMIN WA VIRTUAL</div>`;

      document.getElementById('crumb').textContent = 'Friends Family / ' + p.title;

      document.querySelectorAll('[data-page]').forEach(b => {
        b.classList.toggle('active', b.dataset.page === page);
      });

      document.getElementById('sidebar').classList.remove('open');

      if (pushHistory && history.state?.page !== page) {
        history.pushState({ page: page }, '', `#${page}`);
      }

      window.scrollTo(0, 0);

      if (page === 'home') {
        document.getElementById('homeCards').innerHTML = cardData.map(([id, ico, title, desc]) => `
          <div class="role-card" data-open="${id}">
            <div class="num">BACA PEDOMAN</div>
            <h3>${ico} &nbsp;${title}</h3>
            <p>${desc}</p>
          </div>
        `).join('');

        document.querySelectorAll('[data-open]').forEach(c => {
          c.onclick = () => render(c.dataset.open);
        });

        document.getElementById('search').addEventListener('input', e => {
          const q = e.target.value.toLowerCase();
          document.querySelectorAll('.role-card').forEach(c => {
            c.classList.toggle('hidden', !c.innerText.toLowerCase().includes(q));
          });
        });
      }
    }

    // Event listener untuk navigasi sejarah browser / tombol back HP
    window.addEventListener('popstate', (e) => {
      const page = e.state?.page || location.hash.replace('#', '') || 'home';
      render(page, false);
    });

    document.querySelectorAll('[data-page]').forEach(b => {
      b.addEventListener('click', () => render(b.dataset.page));
    });

    document.getElementById('menuBtn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('open');
    };

    // Inisialisasi awal
    const initialPage = location.hash.replace('#', '') || 'home';
    history.replaceState({ page: initialPage }, '', `#${initialPage}`);
    render(initialPage, false);
  </script>
